[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pngtoolkit"
version = "0.3.0"
description = "Concentrador de operações de imagem: um núcleo Python com adaptadores de CLI e API."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Davi Moreira" }]
keywords = ["image", "png", "resize", "convert", "watermark", "favicon", "toolkit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "pillow>=10.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
cli = ["click>=8.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
avif = ["pillow-avif-plugin>=1.4"]   # opcional — AVIF em Pillow antigo (11.1+ já tem nativo)
heif = ["pillow-heif>=0.13"]   # opcional — habilita heic/heif (leitura e gravação)
bg = ["onnxruntime>=1.17", "numpy>=1.26"]   # opcional — remove-bg modo 'ai' (U²-Net via ONNX)
# svg: sem dependência Python; requer os binários 'magick' e 'potrace' no sistema.
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.scripts]
pik = "pngtoolkit.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pngtoolkit"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# FastAPI usa File()/Form() como defaults (padrão do framework, não é bug).
"src/pngtoolkit/api/app.py" = ["B008"]

[tool.mypy]
# Semântica 3.12 evita falha de parse em stubs de dependências transitivas;
# o runtime continua suportando 3.11+ e o ruff valida a sintaxe-alvo py311.
python_version = "3.12"
packages = ["pngtoolkit"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "PIL",
    "PIL.*",
    "pillow_avif",
    "pillow_avif.*",
    "pillow_heif",
    "pillow_heif.*",
    "onnxruntime",
    "onnxruntime.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "onnxruntime", "onnxruntime.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
